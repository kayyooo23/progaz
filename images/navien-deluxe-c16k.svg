<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Настенный газовый двухконтурный котел Navien Deluxe C 16K">
  <rect width="800" height="800" fill="#FFFFFF"/>
  <rect x="24" y="24" width="752" height="752" rx="6" fill="#F3F5F7"/>

  <!-- фирменная полоса сверху -->
  <rect x="24" y="24" width="752" height="9" rx="0" fill="#F5B301"/>

  <!-- контур товара -->
  <g transform="translate(400 295) scale(11.5) translate(-12 -12)"
     fill="none" stroke="#A9B4BF" stroke-width="1.1"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="16" height="17" rx="2"></rect><rect x="7" y="8" width="10" height="6" rx="1"></rect><line x1="8" y1="18" x2="8" y2="18.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line><line x1="16" y1="18" x2="16" y2="18.01"></line>
  </g>

  <!-- категория -->
  <text x="400" y="532" text-anchor="middle"
        font-family="'IBM Plex Mono', monospace" font-size="19"
        letter-spacing="2.4" fill="#A87A00">ГАЗОВЫЕ КОТЛЫ</text>

  <!-- название -->
  <text x="400" y="578" text-anchor="middle"
        font-family="'IBM Plex Sans', Arial, sans-serif" font-size="29"
        font-weight="700" fill="#171C21"><tspan x="400" dy="0">Настенный газовый</tspan><tspan x="400" dy="34">двухконтурный котел Navien</tspan><tspan x="400" dy="34">Deluxe C 16K</tspan></text>

  <!-- бренд -->
  <text x="400" y="690" text-anchor="middle"
        font-family="'IBM Plex Sans', Arial, sans-serif" font-size="21"
        fill="#5C6B79">Navien</text>

  <!-- пометка, что фото временное -->
  <text x="400" y="752" text-anchor="middle"
        font-family="'IBM Plex Mono', monospace" font-size="15"
        letter-spacing="1.2" fill="#A9B4BF">ФОТО ГОТОВИТСЯ</text>
</svg>
